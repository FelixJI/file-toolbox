[project]
name = "file-toolbox"
version = "0.3.7"
description = "批量文件工具箱:重命名、建文件夹、生成 PDF、内容替换、考勤汇总、发票识别、Excel 合并、PDF 排序、计划排布、Markdown 转换"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "cattrs>=26.1.0",
    "pypdf>=6.15.0",
    "pypdfium2>=5.10.1",
    "Pillow>=10.0",
    "chardet>=5.0",
    "packaging>=24.0",
    "psutil>=7.2.0",
    'pywin32>=306; platform_system == "Windows"',
    "velopack==1.2.161",
    "openpyxl>=3.1",
    "markdown-it-py>=4.2.0",
    "pypandoc-binary>=1.15",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
invoice = ["pdfplumber>=0.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "reportlab>=4.0", "nuitka>=2.6", "types-psutil>=7.0", "types-pywin32>=0.3"]

[project.scripts]
file-toolbox = "file_toolbox.cli.main:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["file_toolbox*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# 仅豁免 4 个真生成物(见 scripts/regen_ui.py 的 UI_SOURCES):uic 输出含 u"" 前缀、
# (object) 基类、# -*- coding -*- 等会被 UP/format 规则改写的写法,手动格式化会与
# 再生成冲突,由 regen_ui.py --check 作为这些文件的质量门。
# generated/ 下其余 6 个 HANDMADE 手写布局与仓库普通代码一样遵守 Ruff 规则;
# 该豁免集合与 UI_SOURCES 的一致性由 tests/test_regen_ui.py 校验。
exclude = [
    "file_toolbox/gui/generated/ui_attendance_dialog.py",
    "file_toolbox/gui/generated/ui_markdown_dialog.py",
    "file_toolbox/gui/generated/ui_mkdir_dialog.py",
    "file_toolbox/gui/generated/ui_plan_schedule_dialog.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"file_toolbox/cli/*" = ["B008"]  # typer.Option/Argument 作为默认参数是惯用模式
"scripts/*" = ["B008"]
"tests/*" = ["E402", "B017"]  # 测试中 E402(importorskip 前置)、B017(测异常基类)合理

[tool.ruff.format]
quote-style = "double"
exclude = ["scripts/automation_core.py"]

[tool.mypy]
python_version = "3.13"
# 本应用是 Windows 桌面工具,依赖 pywin32/winreg/os.startfile 等 Windows-only API。
# 若按宿主平台(如 Linux)检查,会把这些 Windows-only 符号全部报为 attr-defined,
# 产生误报。固定 platform=win32,让 mypy 按目标平台 win32 校验(含 os.startfile /
# winreg 的 Windows 类型存根)——与开发机(Windows)及 CI(Windows runner)一致。
platform = "win32"
# strict:全仓严格类型检查(函数必须注解、禁止隐式 Any、检查返回值等)。
# 全仓已补齐注解并通过(strict 0 错误),现在作为门禁防止类型回归。
strict = true
files = ["file_toolbox"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# pyside6-uic 真生成物(见 scripts/regen_ui.py 的 UI_SOURCES):自动生成、无类型
# 注解、会被再生成覆盖,不强制类型检查。generated/ 下 6 个 HANDMADE 手写布局
# 按普通 strict 规则检查;豁免集合与 UI_SOURCES 的一致性由 tests/test_regen_ui.py 校验。
[[tool.mypy.overrides]]
module = [
    "file_toolbox.gui.generated.ui_attendance_dialog",
    "file_toolbox.gui.generated.ui_markdown_dialog",
    "file_toolbox.gui.generated.ui_mkdir_dialog",
    "file_toolbox.gui.generated.ui_plan_schedule_dialog",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["file_toolbox"]
omit = [
    "file_toolbox/gui/generated/*",
    "file_toolbox/__main__.py",
    "file_toolbox/gui_entry.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
