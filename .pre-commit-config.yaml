repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        exclude: ^scripts/automation_core\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - types-pywin32
          - PySide6>=6.5
          - pypdf>=6.15.0
          - pypdfium2>=5.10.1
          - Pillow>=10.0
          - chardet>=5.0
          - packaging>=24.0
          - psutil>=7.2.0
          - types-psutil>=7.0
          - typer>=0.9
