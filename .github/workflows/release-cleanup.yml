name: Release Cleanup

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      keep_count:
        description: Number of most recent published Releases to retain
        required: true
        default: "5"
        type: string

permissions: {}

jobs:
  cleanup:
    name: Remove old Release objects and retain tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_COUNT: ${{ inputs.keep_count || '5' }}
    steps:
      - name: Delete published Releases beyond the retention window
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KEEP_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::keep_count must be a positive integer"
            exit 1
          fi

          release_pages="$RUNNER_TEMP/release-pages.json"
          obsolete_tsv="$RUNNER_TEMP/obsolete-releases.tsv"
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_pages"
          jq -r --argjson keep "$KEEP_COUNT" '
            [.[][] | select(.draft == false and .published_at != null)]
            | sort_by(.published_at)
            | reverse
            | .[$keep:][]?
            | [.id, .tag_name]
            | @tsv
          ' "$release_pages" > "$obsolete_tsv"
          mapfile -t obsolete_releases < "$obsolete_tsv"

          if (( ${#obsolete_releases[@]} == 0 )); then
            echo "No published Releases fall outside the retention window."
            exit 0
          fi

          for release in "${obsolete_releases[@]}"; do
            IFS=$'\t' read -r release_id tag_name <<< "$release"
            echo "Deleting old Release $tag_name (id=$release_id); Git tag is retained."
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done
