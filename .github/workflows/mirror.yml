name: Mirror

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    # workflow_run 监听整个 Release Please workflow的完成,不区分触发事件。
    # release-please 有两类入口(push main 打 tag / workflow_dispatch 仅开 PR)。
    # 仅对 push 触发的那次运行做镜像(此时 main 有新 commit + 新 tag);
    # 手动开 PR 那次 main 不变,镜像无意义。workflow_dispatch 仍可随时兜底。
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # 所有目标地址与凭据都来自 secret,改地址/换令牌无需改代码。
      GITEE_URL: ${{ secrets.GITEE_URL }}
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      CNB_URL: ${{ secrets.CNB_URL }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main and tags
        run: git fetch origin main --tags --force
      - name: Push main and tags to Gitee
        id: gitee
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEE_URL"   || { echo "::error::GITEE_URL is not configured"; exit 1; }
          test -n "$GITEE_USER"  || { echo "::error::GITEE_USER is not configured"; exit 1; }
          test -n "$GITEE_TOKEN" || { echo "::error::GITEE_TOKEN is not configured"; exit 1; }
          # 标准格式:用户名 + token 一起放 https://<user>:<token>@<host>
          remote="https://${GITEE_USER}:${GITEE_TOKEN}@${GITEE_URL#https://}"
          git push "$remote" refs/remotes/origin/main:refs/heads/main --tags --force
      # --tags --force 使镜像可重复执行:标签是同一 commit 的不可变锚点,
      # 远端已存在的同名标签会被等价 ref 覆盖(内容不变),从而避免
      # "tag already exists" 拒绝导致整步失败。main 分支仍走 fast-forward,不受影响。
      - name: Push main and tags to CNB
        id: cnb
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CNB_URL"   || { echo "::error::CNB_URL is not configured"; exit 1; }
          test -n "$CNB_TOKEN" || { echo "::error::CNB_TOKEN is not configured"; exit 1; }
          # CNB 规范:用户名固定为 cnb,token 放密码槽。
          remote="https://cnb:${CNB_TOKEN}@${CNB_URL#https://}"
          git push "$remote" refs/remotes/origin/main:refs/heads/main --tags --force
      # 失败隔离:两个镜像源任一失败不应阻断另一个。
      # 上方两步加 continue-on-error 后,这里汇总:必须至少有一个源成功,
      # 否则整条镜像同步等价于未执行,job 应判失败(而非误报绿色)。
      - name: Require at least one mirror to succeed
        if: always()
        shell: bash
        run: |
          gitee="${{ steps.gitee.outcome }}"
          cnb="${{ steps.cnb.outcome }}"
          echo "gitee=$gitee cnb=$cnb"
          if [ "$gitee" != "success" ] && [ "$cnb" != "success" ]; then
            echo "::error::所有镜像源推送均失败(gitee=$gitee, cnb=$cnb)"
            exit 1
          fi
          if [ "$gitee" != "success" ]; then
            echo "::warning::Gitee 推送失败($gitee),CNB 已成功,详见对应 step 日志"
          fi
          if [ "$cnb" != "success" ]; then
            echo "::warning::CNB 推送失败($cnb),Gitee 已成功,详见对应 step 日志"
          fi
