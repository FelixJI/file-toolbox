name: Daily Main Release

on:
  schedule:
    # 每天 15:30（北京时间）= 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      bump_part:
        description: "手动发版时选择版本递增方式（仅用于新版本发版）"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      rerun_latest_failed:
        description: "优先补发最近一次尚未成功发布的版本"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      target_tag: ${{ steps.decide.outputs.target_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 判断是否需要发版 & 是否有可补发的失败版本
        id: decide
        shell: bash
        run: |
          git fetch origin main --prune --tags

          TARGET_TAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' }}" = "true" ] && [ "${{ inputs.rerun_latest_failed }}" = "true" ]; then
            for tag in $(git tag --list "v*" --sort=-creatordate); do
              if [ -z "$tag" ]; then
                continue
              fi
              CODE=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
              if [ "$CODE" = "404" ]; then
                TARGET_TAG="$tag"
                break
              fi
            done
          fi

          if [ -n "$TARGET_TAG" ]; then
            echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            echo "target_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" origin/main 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            # 仓库没有发布 tag 时，直接允许发版
            echo "target_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_COMMITS=$(git rev-list --count "${LATEST_TAG}..HEAD")
          if [ "${NEW_COMMITS}" -gt 0 ]; then
            echo "target_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_tag=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  quality_gate:
    needs: detect_changes
    if: needs.detect_changes.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      FILE_TOOLBOX_NO_COM_DETECT: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 安装依赖（GUI + invoice + dev）
        run: uv sync --extra gui --extra invoice --extra dev

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest（核心模块）
        run: uv run pytest --cov=file_toolbox.core --cov-fail-under=88 -q

      - name: pytest（全量）
        run: uv run pytest --cov=file_toolbox --cov-fail-under=75 -q

  create_release_tag:
    needs:
      - detect_changes
      - quality_gate
    if: needs.detect_changes.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.detect_changes.outputs.target_tag || 'main' }}

      - name: 安装 uv
        if: ${{ needs.detect_changes.outputs.target_tag == '' }}
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 补发失败版本或创建新版本
        shell: bash
        run: |
          TARGET_TAG="${{ needs.detect_changes.outputs.target_tag }}"
          if [ -n "$TARGET_TAG" ]; then
            echo "发现可补发的失败版本：$TARGET_TAG"
            curl -sS -f -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"${TARGET_TAG}\"}}"
            echo "补发 Release 工作流已触发：$TARGET_TAG"
            exit 0
          fi

          VERSION_PART="${{ inputs.bump_part || 'patch' }}"
          echo "未检测到可补发版本，执行质量通过后的新版本 bump: ${VERSION_PART}"
          uv sync --extra gui --extra invoice --extra dev
          uv run --extra dev python scripts/release.py "$VERSION_PART" --skip-build --ci
