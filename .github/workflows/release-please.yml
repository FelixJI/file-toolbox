name: Release Please

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump in the Release PR
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js for the pinned Release Please CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compute requested version
        id: version
        shell: python
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          import json
          import os
          from pathlib import Path

          current = json.loads(Path(".release-please-manifest.json").read_text())["."]
          major, minor, patch = map(int, current.split("-", 1)[0].split("."))
          bump = os.environ["BUMP"]
          if bump == "major":
              version = f"{major + 1}.0.0"
          elif bump == "minor":
              version = f"{major}.{minor + 1}.0"
          else:
              version = f"{major}.{minor}.{patch + 1}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"next={version}\n")
      - name: Create or update Release PR
        shell: bash
        env:
          RELEASE_AS: ${{ steps.version.outputs.next }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # release-please-action v5 ignores the dynamic release-as input in
          # manifest mode. The pinned CLI forwards it to Manifest.fromManifest.
          npx --yes release-please@17.11.1 release-pr \
            --repo-url="$GITHUB_REPOSITORY" \
            --target-branch=main \
            --token="$RELEASE_PLEASE_TOKEN" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --release-as="$RELEASE_AS"

  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create tag and draft Release for a merged Release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
