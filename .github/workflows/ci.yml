name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: hashFiles('sidecar/go.mod') != ''
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Verify repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/automation.py ci
          --event '${{ github.event_name }}'
          --source-sha '${{ github.sha }}'
      - name: Upload main release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: build/automation/release-candidate
          if-no-files-found: error
          retention-days: 14
