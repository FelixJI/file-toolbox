name: CI

# 质量门禁:push main / PR 时跑 lint + format + mypy + pytest。
# 职责单一,发版逻辑见 release.yml。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      FILE_TOOLBOX_NO_COM_DETECT: "1"
      QT_QPA_PLATFORM: offscreen
      # 英文区域 runner 的 Python 默认 stdout/stderr 编码为 cp1252,
      # 脚本打印中文/✓/✗ 时会 UnicodeEncodeError。UTF-8 模式覆盖所有子进程。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 同步依赖(含 gui + invoice + dev)
        run: uv sync --extra gui --extra invoice --extra dev

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: UI 漂移检查(regen_ui --check)
        # 校验「pyside6-uic 再生成结果 == 已提交 ui_*.py」;有 .ui 源的(如 mkdir)被校验,
        # 标记为 HANDMADE 的(无 .ui)跳过。新增/迁移 .ui 后此步自动生效防漂移。
        run: uv run --extra dev python scripts/regen_ui.py --check

      - name: pytest + core 覆盖率(行+分支 ≥90%)
        # --cov-branch:启用分支覆盖。仅行覆盖率无法发现「分支未覆盖」(如异常分支、
        # 条件取反),本次加固已把 core 分支覆盖提升至 99%,门禁阈值 88→90 防回归。
        # -W error::*:把被吞的 ResourceWarning(未关句柄)/DeprecationWarning 变红,
        # 提前暴露资源泄漏与弃用 API。
        run: >
          uv run pytest --cov=file_toolbox.core --cov-branch --cov-fail-under=90
          -W error::ResourceWarning -W error::DeprecationWarning -q

      - name: pytest + 总盘覆盖率(行+分支 ≥90%)
        run: >
          uv run pytest --cov=file_toolbox --cov-branch --cov-fail-under=90
          -W error::ResourceWarning -W error::DeprecationWarning -q

      - name: 测试用例数不回退(G3)
        # 防止误删测试导致用例数悄悄下降(line coverage 发现不了「整类边界用例被删」)。
        # 基线随新增用例上调,见 scripts/check_test_count.py。
        run: uv run --extra dev python scripts/check_test_count.py
