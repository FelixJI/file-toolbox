name: CI

# 质量门禁:push main / PR 时跑 lint + format + mypy + pytest。
# 职责单一,发版逻辑见 release.yml。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      FILE_TOOLBOX_NO_COM_DETECT: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 同步依赖(含 gui + invoice + dev)
        run: uv sync --extra gui --extra invoice --extra dev

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: UI 漂移检查(regen_ui --check)
        # 检测 ui_*.py 是否与 .ui 源漂移;当前全部为手维护(无 .ui)时此步通过。
        # 补齐 .ui 后会自动校验「pyside6-uic 再生成结果 == 已提交 ui_*.py」。
        run: uv run --extra dev python scripts/regen_ui.py --check

      - name: pytest + core 覆盖率(≥88%)
        run: uv run pytest --cov=file_toolbox.core --cov-fail-under=88 -q

      - name: pytest + 总盘覆盖率(≥90%)
        run: uv run pytest --cov=file_toolbox --cov-fail-under=90 -q
