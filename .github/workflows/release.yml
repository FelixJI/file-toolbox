name: Release

# 完整发版流水线(本质是 CD):decide → build → publish。
# 触发:
#   1. 每天定时(北京时间 15:30):有新 commit 才发新版
#   2. 手动 workflow_dispatch:可指定 bump_part 发新版,或补发最近一次失败版本
# 不再用 push: tags 自触发(原来 daily 与 release 被 tag push + API 反向调用串成两段,现合并为一)。
on:
  schedule:
    # 每天 15:30(北京时间)= 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      bump_part:
        description: "发新版时选择版本递增方式(仅用于新版本发版)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      rerun_latest_failed:
        description: "优先补发最近一次尚未成功发布的版本"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  # ---------- job 1:决定发什么 ----------
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      mode: ${{ steps.decide.outputs.mode }} # new | rerun | none
      target_tag: ${{ steps.decide.outputs.target_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 判断发版模式(补发失败版本 / 新版 / 跳过)
        id: decide
        shell: bash
        run: |
          git fetch origin main --prune --tags

          # 公共函数:扫描 v* tag,返回第一个在 GitHub Releases 不存在的(最近失败版本)。
          find_first_unreleased_tag() {
            for tag in $(git tag --list "v*" --sort=-creatordate); do
              [ -z "$tag" ] && continue
              CODE=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
              if [ "$CODE" = "404" ]; then
                echo "$tag"
                return 0
              fi
            done
            return 1
          }

          MODE="none"
          TARGET_TAG=""

          # 手动触发:优先补发失败版本
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rerun_latest_failed }}" = "true" ]; then
            if TARGET_TAG=$(find_first_unreleased_tag); then
              MODE="rerun"
            fi
          fi

          # 没有可补发的 → 看是否需要发新版
          if [ "$MODE" = "none" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 手动触发且无失败版本可补发 → 直接发新版
              MODE="new"
            else
              # 定时:仅当 main 有新 commit 才发
              LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" origin/main 2>/dev/null || true)
              if [ -z "$LATEST_TAG" ]; then
                MODE="new" # 仓库尚无发布 tag
              else
                NEW_COMMITS=$(git rev-list --count "${LATEST_TAG}..HEAD")
                if [ "${NEW_COMMITS}" -gt 0 ]; then
                  MODE="new"
                fi
              fi
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          [ "$MODE" = "none" ] && echo "should_release=false" >> "$GITHUB_OUTPUT" || echo "should_release=true" >> "$GITHUB_OUTPUT"

          echo "::notice::发版模式 = $MODE, target_tag = ${TARGET_TAG:-(新版本,待 bump)}"

  # ---------- job 2:构建(含新版本 bump) ----------
  build:
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: windows-latest
    outputs:
      resolved_tag: ${{ steps.resolve_tag.outputs.resolved_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 安装依赖（GUI + invoice + dev）
        run: uv sync --extra gui --extra invoice --extra dev

      # 新版本:跑 release.py --ci(内部 bump_version --push 会 commit+tag+push),再抓出新 tag。
      # 补发:跳过 bump,直接用 target_tag。
      - name: 计算最终发布 tag
        id: resolve_tag
        shell: bash
        env:
          MODE: ${{ needs.decide.outputs.mode }}
          TARGET_TAG: ${{ needs.decide.outputs.target_tag }}
          VERSION_PART: ${{ inputs.bump_part || 'patch' }}
        run: |
          if [ "$MODE" = "rerun" ]; then
            echo "resolved_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # new:执行 bump(bump_version.py bump --push 会打 tag 并 push)
          uv run --extra dev python scripts/release.py "$VERSION_PART" --skip-build --ci
          # release.py 走的是 bump_version,最新 tag 即本次产物
          NEW_TAG=$(git describe --tags --abbrev=0 --match "v*")
          if [ "${NEW_TAG#v}" = "$NEW_TAG" ]; then
            echo "::error::bump 后未取得合法 vX.Y.Z tag(得到 $NEW_TAG)"
            exit 1
          fi
          echo "resolved_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::已 bump 并推送 tag $NEW_TAG"

      - name: Checkout 发布 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.resolved_tag }}
          clean: true

      - name: 安装依赖（按 tag 重建）
        run: uv sync --extra gui --extra invoice --extra dev

      - name: PyInstaller 构建
        run: uv run --extra dev python scripts/build_exe.py --ci

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FileToolbox-win64
          path: |
            dist/FileToolbox-*-win64.zip
            dist/checksums.txt
          if-no-files-found: error

  # ---------- job 3:发布 GitHub Release ----------
  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.resolved_tag }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: FileToolbox-win64
          path: artifacts

      - name: 计算 release version
        id: ver
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.resolved_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::未获取到 tag 信息"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 提取 Release notes
        run: uv run --extra dev python scripts/extract_changelog.py "${{ steps.ver.outputs.version }}" --out release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.resolved_tag }}
          body_path: release_notes.md
          files: |
            artifacts/FileToolbox-*-win64.zip
            artifacts/checksums.txt

  # ---------- job 4:清理历史 Release(保留最近 5 个)----------
  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 清理历史 Release(保留最近 5 个,仅删 Release+产物,保留 git tag)
        run: uv run --extra dev python scripts/cleanup_releases.py --keep 5 --repo "$REPO" --token "$TOKEN"
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
