name: Build, Verify and Publish Release

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.1.15
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Resolve draft Release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      available: ${{ steps.release.outputs.available }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the requested or latest semantic-version draft
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            # REST pagination is used so drafts beyond the first page are not missed.
            # Only accept a draft whose tag points at this workflow_run commit.
            # This prevents a later unrelated main push from publishing a manually
            # rebuilt or otherwise stale draft that was intentionally left private.
            mapfile -t candidates < <(
              gh api --paginate --slurp \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                jq -r '.[][] | select(
                  .draft == true and
                  (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))
                ) | .tag_name' |
                sort -Vr
            )
            tag=""
            for candidate in "${candidates[@]}"; do
              if ! ref_json="$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/git/ref/tags/${candidate}" 2>/dev/null)"; then
                echo "::warning::Draft $candidate has no resolvable Git tag; skipping it."
                continue
              fi
              object_type="$(jq -r '.object.type' <<< "$ref_json")"
              object_sha="$(jq -r '.object.sha' <<< "$ref_json")"
              if [[ "$object_type" == "tag" ]]; then
                object_sha="$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                  --jq '.object.sha')"
              fi
              if [[ "$object_sha" == "$TRIGGER_SHA" ]]; then
                tag="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$tag" ]]; then
            echo "::notice::No semantic-version draft Release is waiting for assets."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag is not semantic: $tag"
            exit 1
          fi

          release_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          if [[ "$(jq -r '.draft' <<< "$release_json")" != "true" ]]; then
            echo "::error::Release $tag must exist and remain a draft before building."
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build, gate and publish Windows package
    needs: [resolve]
    if: needs.resolve.outputs.available == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ needs.resolve.outputs.release_tag }}
      cancel-in-progress: false
    env:
      FILE_TOOLBOX_NO_COM_DETECT: "1"
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag, source version and draft Release
        shell: pwsh
        run: |
          $version = (python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match source version v$version"
          }

          $headCommit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($headCommit -ne $tagCommit) {
            throw "Checked-out commit $headCommit does not match tag commit $tagCommit"
          }
          if ($env:EVENT_NAME -eq "workflow_run" -and $tagCommit -ne $env:TRIGGER_SHA) {
            throw "Automatic release tag commit $tagCommit does not match trigger $env:TRIGGER_SHA"
          }

          $release = gh api `
            -H "Accept: application/vnd.github+json" `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw "Release id $env:RELEASE_ID is not the expected draft $env:RELEASE_TAG"
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "ZIP_NAME=FileToolbox-$version-win64.zip" >> $env:GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install release dependencies
        run: uv sync --extra gui --extra invoice --extra dev

      - name: Verify version and release contract
        run: uv run --extra dev python scripts/check_release_contract.py

      - name: Build immutable release candidate
        run: uv run --extra dev python scripts/build_exe.py --ci

      - name: Verify local release candidate
        shell: pwsh
        run: |
          $zip = Join-Path dist $env:ZIP_NAME
          $checksums = Join-Path dist "checksums.txt"
          $allZips = @(Get-ChildItem dist -File -Filter "FileToolbox-*-win64.zip")
          if ($allZips.Count -ne 1 -or -not (Test-Path -LiteralPath $zip)) {
            throw "Expected exactly one release archive named $env:ZIP_NAME"
          }
          if (-not (Test-Path -LiteralPath $checksums)) {
            throw "Missing dist/checksums.txt"
          }

          $checksumLine = Get-Content -LiteralPath $checksums |
            Where-Object { $_ -match "^[0-9a-fA-F]{64}\s+$([regex]::Escape($env:ZIP_NAME))$" }
          if (@($checksumLine).Count -ne 1) {
            throw "checksums.txt must contain exactly one SHA256 entry for $env:ZIP_NAME"
          }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Local SHA256 mismatch for $env:ZIP_NAME"
          }

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: UI drift check
        run: uv run --extra dev python scripts/regen_ui.py --check

      - name: pytest + core branch coverage
        run: >
          uv run pytest --cov=file_toolbox.core --cov-branch --cov-fail-under=90
          -W error::ResourceWarning -W error::DeprecationWarning -q

      - name: pytest + repository branch coverage
        run: >
          uv run pytest --cov=file_toolbox --cov-branch --cov-fail-under=90
          -W error::ResourceWarning -W error::DeprecationWarning -q

      - name: Test count must not regress
        run: uv run --extra dev python scripts/check_test_count.py

      - name: Validate ordinary Python package build
        run: uv build --out-dir build/package-validation

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v6
        with:
          name: FileToolbox-${{ env.RELEASE_TAG }}
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload assets to draft Release
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG `
            "dist/$env:ZIP_NAME" `
            "dist/checksums.txt" `
            --clobber

      - name: Verify required Release assets
        shell: pwsh
        run: |
          $release = gh api `
            -H "Accept: application/vnd.github+json" `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft) {
            throw "Release was published before asset verification completed"
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @($env:ZIP_NAME, "checksums.txt")) {
            if (@($assetNames | Where-Object { $_ -eq $required }).Count -ne 1) {
              throw "Required Release asset is missing or duplicated: $required"
            }
          }

      - name: Publish verified Release on the automatic path
        if: github.event_name == 'workflow_run'
        shell: pwsh
        env:
          # A PAT is required here so release:published can trigger cleanup/mirror.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          $release = gh api `
            --method PATCH `
            -H "Accept: application/vnd.github+json" `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
            -F draft=false | ConvertFrom-Json
          if ($release.draft) {
            throw "Release $env:RELEASE_TAG is still a draft after publish request"
          }
          Write-Host "::notice::Published verified Release $env:RELEASE_TAG"

      - name: Keep manual rebuild as a draft
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Write-Host "::notice::Assets verified; manual fallback leaves $env:RELEASE_TAG as a draft."
