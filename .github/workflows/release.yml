name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.1.15
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload Windows package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Verify tag and draft Release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match repository version v$version"
          }
          $isDraft = (gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft').Trim()
          if ($isDraft -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain a draft before assets are uploaded"
          }

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra gui --extra invoice --extra dev

      - name: Build with PyInstaller
        run: uv run --extra dev python scripts/build_exe.py --ci

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: FileToolbox-${{ inputs.release_tag }}
          path: |
            dist/FileToolbox-*-win64.zip
            dist/checksums.txt
          if-no-files-found: error

      - name: Attach assets to draft Release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assets = @(Get-ChildItem dist -File |
            Where-Object { $_.Name -like 'FileToolbox-*-win64.zip' -or $_.Name -eq 'checksums.txt' } |
            ForEach-Object FullName)
          if ($assets.Count -lt 2) {
            throw "Expected package archive and checksums"
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
